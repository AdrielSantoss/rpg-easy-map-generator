<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Mapas de RPG</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-mode="sketch">
    <header>
      <h1>Gerador de Mapas de RPG</h1>
      <p>Desenhe o contorno dos continentes. O que ficar fechado vira terra, o resto vira mar.</p>
    </header>

    <main class="layout">
      <aside class="panel">
        <section class="sketch-only">
          <h2>Desenho</h2>
          <button id="tool-pen" class="active" title="Desenhar contorno">Pincel</button>
          <button id="tool-eraser" title="Apagar traços">Borracha</button>
          <button id="undo" title="Desfaz a última alteração (Ctrl+Z)" disabled>Desfazer</button>
          <button id="clear">Limpar</button>
          <button id="example" title="Carrega um esboço de exemplo">Exemplo</button>
        </section>
        <section class="map-only">
          <h2>Terreno</h2>
          <button data-tool="mountains">Montanha</button>
          <button data-tool="forest">Floresta</button>
          <button data-tool="desert">Deserto</button>
          <button data-tool="swamp">Pântano</button>
          <button data-tool="snow" title="Cobre de neve o terreno que estiver embaixo">Neve</button>
          <button data-tool="plains">Planície</button>
          <label for="brush-size">Tamanho do pincel</label>
          <input id="brush-size" type="range" step="2" title="Quanto terreno cada pincelada cobre" />
          <button id="clear-hints" title="Desfaz tudo o que foi pintado e volta ao terreno natural">
            Limpar pintura
          </button>
        </section>
        <section class="map-only">
          <h2>Estruturas</h2>
          <button data-tool="kingdom">Reino</button>
          <button data-tool="city">Cidade</button>
          <button data-tool="village">Vila</button>
          <button data-tool="tower">Torre</button>
          <button data-tool="port">Porto</button>
          <button data-tool="ruins">Ruínas</button>
          <button data-tool="dungeon">Masmorra</button>
          <button id="connect-all" title="Cria estradas ligando todas as estruturas de cada continente">
            Ligar tudo
          </button>
        </section>
        <section class="map-only">
          <h2>Nomes</h2>
          <button data-tool="label" title="Clique em qualquer ponto do mapa para escrever um nome ali">
            Escrever nome
          </button>
        </section>
        <section class="map-only">
          <button data-tool="remove" title="Clique numa estrutura, estrada ou área pintada para remover">
            Remover
          </button>
        </section>
      </aside>

      <div class="center">
        <div class="stage" id="stage">
          <div class="viewport" id="viewport">
            <canvas id="sketch" width="1200" height="800"></canvas>
            <canvas id="map"></canvas>
            <canvas id="overlay"></canvas>
            <div id="brush" hidden></div>
          </div>
          <button id="zoom-reset" title="Voltar a ver o mapa inteiro" hidden></button>
          <div id="structure-menu" class="map-menu" hidden></div>
          <div id="region-menu" class="map-menu" hidden></div>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
      </div>

      <aside class="panel">
        <section>
          <h2>Mapa</h2>
          <label for="seed">Seed</label>
          <input id="seed" type="text" spellcheck="false" autocomplete="off" />
          <button id="reroll" title="Sorteia outra seed">Nova variação</button>
          <button id="generate" class="primary">Gerar mapa</button>
        </section>
        <section class="map-only">
          <button id="open-distribution" title="Define quantos % do mapa cada terreno ocupa">
            Distribuição do terreno
          </button>
          <button
            id="toggle-regions"
            class="active"
            title="Mostra ou esconde os nomes de mares, florestas, montanhas…"
          >
            Nomes das regiões
          </button>
          <button id="restore-regions" title="Traz de volta os nomes de região que foram excluídos" disabled>
            Restaurar nomes
          </button>
          <button id="back">Editar esboço</button>
          <button id="export">Exportar PNG</button>
        </section>
        <section>
          <h2>Projeto</h2>
          <div class="pair">
            <button id="undo-map" title="Desfaz a última alteração (Ctrl+Z)" disabled>Desfazer</button>
            <button id="redo" title="Refaz o que foi desfeito (Ctrl+Y)" disabled>Refazer</button>
          </div>
          <button
            id="save-file"
            title="Baixa um arquivo com tudo: esboço, terreno, estruturas, estradas e nomes"
          >
            Salvar arquivo
          </button>
          <button id="open-file" title="Abre um arquivo de projeto salvo antes">Abrir arquivo</button>
          <input id="file-input" type="file" accept=".json,application/json" hidden />
          <button id="new-project" class="danger" title="Apaga tudo e começa do zero">Novo mapa</button>
          <p class="hint">O trabalho é salvo sozinho neste navegador.</p>
        </section>
      </aside>
    </main>

    <dialog id="distribution-dialog" aria-labelledby="distribution-title">
      <h2 id="distribution-title">Distribuição do terreno</h2>
      <p>Quanto do continente cada terreno ocupa.</p>
      <div id="distribution"></div>
      <div class="dialog-actions">
        <button id="reset-distribution" title="Volta à distribuição natural do mapa">Automático</button>
        <button id="cancel-distribution">Cancelar</button>
        <button
          id="apply-distribution"
          class="primary"
          title="Refaz o terreno com estes percentuais"
          autofocus
        >
          Aplicar
        </button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
