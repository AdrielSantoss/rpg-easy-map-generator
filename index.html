<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerador de Mapas de RPG</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body data-mode="sketch">
    <header>
      <h1>Gerador de Mapas de RPG</h1>
      <p>Desenhe o contorno dos continentes. O que ficar fechado vira terra, o resto vira mar.</p>
    </header>

    <div class="toolbar">
      <div class="group sketch-only">
        <button id="tool-pen" class="active" title="Desenhar contorno">Pincel</button>
        <button id="tool-eraser" title="Apagar traços">Borracha</button>
        <button id="undo" title="Desfazer último traço (Ctrl+Z)">Desfazer</button>
        <button id="clear">Limpar</button>
        <button id="example" title="Carrega um esboço de exemplo">Exemplo</button>
      </div>
      <div class="group map-only">
        <button id="back">Editar esboço</button>
        <button id="export">Exportar PNG</button>
      </div>
      <div class="group map-only" id="palette">
        <label>Colocar</label>
        <button data-place="kingdom">Reino</button>
        <button data-place="city">Cidade</button>
        <button data-place="village">Vila</button>
        <button data-place="tower">Torre</button>
        <button data-place="port">Porto</button>
        <button data-place="ruins">Ruínas</button>
        <button data-place="dungeon">Masmorra</button>
        <button data-place="remove" title="Clique numa estrutura para removê-la">Remover</button>
      </div>
      <div class="group">
        <label for="seed">Seed</label>
        <input id="seed" type="text" spellcheck="false" autocomplete="off" />
        <button id="reroll" title="Sorteia outra seed">Nova variação</button>
        <button id="generate" class="primary">Gerar mapa</button>
      </div>
    </div>

    <div class="stage">
      <canvas id="sketch" width="1200" height="800"></canvas>
      <canvas id="map"></canvas>
      <canvas id="overlay"></canvas>
    </div>

    <p id="status" role="status" aria-live="polite"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
